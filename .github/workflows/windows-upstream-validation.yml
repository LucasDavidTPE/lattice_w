# Fork-only native verification; absent from the upstream proposal.
name: Windows upstream preparation
on:
  push:
    branches: [windows-upstream]
  workflow_dispatch:
concurrency:
  group: upstream-preparation-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - name: Stub resources
        shell: bash
        run: |
          mkdir -p src-tauri/synara-runtime
          echo stub > src-tauri/synara-runtime/placeholder.txt
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - if: matrix.os == 'macos-latest'
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
